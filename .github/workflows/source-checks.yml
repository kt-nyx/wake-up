name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check private fixture boundary
        shell: pwsh
        run: ./build/Verify-FixtureBoundary.ps1
      - name: Run Python fixture and release checks without game files
        run: python -m unittest discover -s tests -p "test_*.py"
